<div class="max-w-4xl mx-auto p-6 bg-blue-900 text-white rounded-lg shadow-2xl border border-blue-700 my-8 font-sans">
  
  <div class="text-center border-b border-white-900 pb-4 mb-6">
    <h1 class="text-5xl font-bold tracking-wider uppercase text-white"> Cinépolis </h1>
    <h2 class="tracking-wider text-white"> LA CAPITAL DEL CINE </h2>
  </div>

  <form [formGroup]="formulario">

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
      
      <div class="border border-blue-400 p-4 rounded-lg bg-blue-950/45">
        <h3 class="text-blue-200 font-semibold text-sm mb-4 border-b border-blue-800 pb-2 italic">Entradas</h3>

        <div class="mb-4 flex items-center justify-between">
          <label for="nombre" class="text-sm font-medium text-blue-200 w-1/3">Nombre</label>
          <input type="text" id="nombre" placeholder="name" formControlName="nombre" class="bg-blue-950 border border-blue-700 text-white text-sm rounded px-3 py-1.5 w-2/3 focus:ring-yellow-400 focus:border-yellow-400">
        </div>

        <div class="mb-4 flex items-center justify-between">
          <label for="cantidadCompradores" class="text-sm font-medium text-blue-200 w-1/3">Cantidad Compradores</label>
          <input type="number" id="cantidadCompradores" formControlName="cantidadCompradores" class="bg-blue-950 border border-blue-700 text-white text-sm rounded px-3 py-1.5 w-2/3 focus:ring-yellow-400 focus:border-yellow-400">
        </div>

        <div class="mb-4 flex items-center justify-between">
          <label class="text-sm font-medium text-blue-200 w-1/3">Tarjeta Cineco </label>
          <div class="flex items-center space-x-4 w-2/3">
            <label class="flex items-center space-x-1 cursor-pointer">
              <input type="radio" value="Si" formControlName="tarjetaCineco" class="text-yellow-500 focus:ring-yellow-400">
              <p class="text-sm">Si</p>
            </label>
            <label class="flex items-center space-x-1 cursor-pointer">
              <input type="radio" value="No" formControlName="tarjetaCineco" class="text-yellow-500 focus:ring-yellow-400">
              <p class="text-sm">No</p>
            </label>
          </div>
        </div>

        <div class="mb-2 flex items-center justify-between">
          <label for="cantidadBoletas" class="text-sm font-medium text-blue-200 w-1/3">Cantidad De Boletas</label>
          <input type="number" id="cantidadBoletas" placeholder="Boletas Maximas 7" formControlName="cantidadBoletas" min="1" max="7" class="bg-blue-950 border border-blue-700 text-white text-sm rounded px-3 py-1.5 w-2/3 focus:ring-yellow-400 focus:border-yellow-400">
        </div>
      </div>

      <div class="flex flex-col justify-between space-y-6">
        
        <div class="border border-blue-400 p-4 rounded-lg bg-blue-950/40">
          <h3 class="text-blue-200 font-semibold text-sm mb-4 border-b border-blue-800 pb-2 italic">Salidas</h3>
          
          <div class="flex items-center justify-between py-2">
            <label class="text-sm font-medium text-blue-200 w-1/3">Valor a Pagar</label>
            <input type="text" readonly [value]="pagar" class="bg-blue-950 border border-blue-700 text-blue-400 font-bold text-sm rounded px-3 py-1.5 w-2/3 focus:outline-none" placeholder="$">
          </div>
        </div>

        <div class="border border-blue-400 p-4 rounded-lg bg-blue-950/40">
          <h3 class="text-blue-200 font-semibold text-sm mb-4 border-b border-blue-800 pb-2 italic">Acciones</h3>
          
          <div class="flex justify-center gap-4 py-2">
            <button type="button" (click)="procesarCompra()" class="text-blue-950 bg-gray-200 hover:bg-white font-medium rounded px-6 py-1.5 text-sm shadow border border-gray-400 transition-colors">Procesar</button>
            <button type="button" (click)="salir()" class="text-blue-950 bg-gray-200 hover:bg-white font-medium rounded px-6 py-1.5 text-sm shadow border border-gray-400 transition-colors"> Salir</button>
            <button type="button" (click)="salir()" class="text-blue-950 bg-gray-200 hover:bg-white font-medium rounded px-6 py-1.5 text-sm shadow border border-gray-400 transition-colors"> Ver ventas </button>
          </div>
        </div>

      </div>

    </div>

    <div *ngIf="error" class="mb-5 text-red-300 text-xs bg-purple-950 p-3 rounded border border-pink-800 text-center"> {{ error }}</div>

  </form>

</div>
