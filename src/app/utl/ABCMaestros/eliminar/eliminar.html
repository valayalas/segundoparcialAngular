<div class="min-h-screen flex justify-center items-center bg-gray-50 p-4">
  
  <!-- Tarjeta (Card) -->
  <div class="bg-white block max-w-sm w-full p-6 border border-gray-200 rounded-lg shadow-sm">
    
    <a href="#">
      <img class="rounded-lg w-full h-auto object-cover" src="/img/user.avif" alt="User" />
    </a>
    
    <a href="#">
      <h5 class="mt-6 mb-2 text-2xl font-semibold tracking-tight text-gray-900">
        ID Maestro: {{regMaestro.idmaestro}}.
      </h5>
    </a>
   
    <p class="mb-2 text-gray-600">
        Nombre: {{regMaestro.nombre | uppercase}} | Apaterno: {{regMaestro.apaterno}}
    </p>
    <p class="mb-2 text-gray-600">
        Amaterno: {{regMaestro.amaterno}}
    </p>
    <p class="mb-4 text-gray-600">
        Correo: {{regMaestro.correo}}
    </p>
   
    <!-- Botón Eliminar -->
    <button
      type="button"
      (click)="eliminarMaestro()"
      class="w-full mb-2 text-white bg-rose-600 hover:bg-rose-700 focus:ring-4 focus:ring-rose-300 font-medium rounded-lg text-sm px-4 py-2.5 text-center inline-flex items-center justify-center transition-colors shadow-sm"
    >
      Eliminar Maestro
    </button>

    <!-- Botón Cancelar -->
    <a
      [routerLink]="['/utl/maestros']"
      class="w-full inline-flex items-center justify-center text-gray-700 bg-gray-100 border border-gray-300 hover:bg-gray-200 focus:ring-4 focus:ring-gray-100 font-medium rounded-lg text-sm px-4 py-2.5 text-center transition-colors"
    >
      Cancelar
      <svg
        class="w-4 h-4 ms-1.5 rtl:rotate-180 -me-0.5"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        fill="none"
        viewBox="0 0 24 24"
      >
        <path
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M19 12H5m14 0-4 4m4-4-4-4"
        />
      </svg>
    </a>

  </div>
</div>
