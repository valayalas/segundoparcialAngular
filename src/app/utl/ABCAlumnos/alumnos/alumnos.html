<div class="max-w-7xl mx-auto mt-6 bg-white border border-gray-200 rounded-lg shadow-sm p-6">

  <!-- Botón Agregar -->
  <div class="mb-4">
    <button routerLink="/utl/alumnos/nuevo" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg flex items-center gap-2 shadow-sm">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
      Agregar
    </button>
  </div>

  <!-- Filtro -->
  <div class="mb-6">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
      <div>
        <label class="block text-sm font-medium text-gray-700">
          Filtrar por:
        </label>
      </div>
      <div class="md:col-span-2">
        <input
          [(ngModel)]="listFilter"
          type="text"
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
          placeholder="Filtrar alumnos...">
      </div>
    </div>
  </div>

  <!-- Tabla -->
  <div class="relative overflow-x-auto rounded-lg border border-gray-200">
    <table class="w-full text-sm text-left text-gray-500">
      <thead class="text-xs text-gray-700 uppercase bg-gray-100">
        <tr>
          <th scope="col" class="px-6 py-3">Matricula</th>
          <th class="px-6 py-3">Nombre</th>
          <th class="px-6 py-3">Apaterno</th>
          <th class="px-6 py-3">Amaterno</th>
          <th class="px-6 py-3">Correo</th>
          <th class="px-6 py-3 text-center">Editar</th>
          <th class="px-6 py-3 text-center">Eliminar</th>
        </tr>
      </thead>

      <tbody>
        <tr
          *ngFor="let alumno of dataSource"
          class="bg-white border-b border-gray-200 hover:bg-gray-50">

          <td class="px-6 py-4 font-medium text-gray-900">{{ alumno.matricula }}</td>
          <td class="px-6 py-4">{{ alumno.nombre | uppercase }}</td>
          <td class="px-6 py-4">{{ alumno.apaterno }}</td>
          <td class="px-6 py-4">{{ alumno.amaterno }}</td>
          <td class="px-6 py-4">{{ alumno.correo }}</td>

          <!-- Botón Editar -->
          <td class="px-6 py-4 text-center">
            <button class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-md text-xs font-medium flex items-center justify-center gap-1 mx-auto shadow-sm">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
              </svg>
              Editar
            </button>
          </td>

          <!-- Botón Eliminar -->
          <td class="px-6 py-4 text-center">
            <button class="bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded-md text-xs font-medium flex items-center justify-center gap-1 mx-auto shadow-sm">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
              Elimina
            </button>
          </td>

        </tr>
      </tbody>
    </table>
  </div>
</div>
